name: refresh profile assets

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile-assets
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tools/build.py shells out to `gh`, which is preinstalled on runners and
      # picks the token up from GH_TOKEN.
      - name: Render SVG assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build.py

      - name: Commit if anything moved
        run: |
          set -euo pipefail
          # Align with the remote before committing.  assets/ and data/ are
          # generated, so the freshly rendered tree is the source of truth and
          # any remote copy of those files is discarded rather than merged —
          # this is what keeps the daily run from colliding with local edits.
          git fetch --quiet origin main
          git reset --mixed --quiet origin/main
          git add assets data
          if git diff --cached --quiet; then
            echo "assets already current"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile assets"
          git push origin HEAD:main
